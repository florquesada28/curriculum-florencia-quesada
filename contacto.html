<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto - Mi Portfolio</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/svg+xml" href="img/vector.svg">
</head>

<body class="body-contacto">
    <!-- HEADER -->
    <header>
        <nav class="navegacion-principal">
            <ul class="menu-izquierda">
                <li><a href="sobre-mi.html">SOBRE MÍ</a></li>
                <li><a href="proyectos.html">PROYECTOS</a></li>
            </ul>
            <a href="index.html" class="logo-link">
                <img src="img/favicon.vsg.svg" alt="Logo Margen">
            </a>
            <ul class="menu-derecha">
                <li><a href="contacto.html" class="pagina-actual">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTACTO -->
    <main class="seccion-contacto-total">

        <!-- ENCABEZADO SUPERIOR DERECHO -->
        <div class="div-encabezado-contacto">
            <h1 class="h1-titulo-intro">¿Tenés una idea en mente?</h1>
            <p class="p-intro">Si querés trabajar conmigo o hacer una consulta escribime.</p>
        </div>

        <!-- SECCIÓN PRINCIPAL (HABLEMOS + TARJETA FORMULARIO) -->
        <section class="section-contenido-contacto">

            <!-- TÍTULO ROJO GIGANTE EN TRES LÍNEAS (SEMIBOLD) -->
            <h2 class="h2-titulo-grande">
                <span class="silaba">HA</span>
                <span class="silaba">BLE</span>
                <span class="silaba">MOS</span>
            </h2>

            <!-- FORMULARIO -->
            <form class="form-formulario-contacto">

                <!-- COLUMNA IZQUIERDA -->
                <div class="div-columna-inputs-izquierda">

                    <div class="div-campo-form">
                        <label for="nombre">NOMBRE</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                    </div>

                    <div class="div-campo-form">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="Tu@email.com">
                    </div>

                    <div class="div-campo-form">
                        <label for="asunto">ASUNTO</label>
                        <input type="text" id="asunto" name="asunto" placeholder="Escribí el asunto">
                    </div>

                </div>

                <!-- COLUMNA DERECHA -->
                <div class="div-columna-inputs-derecha">

                    <div class="div-campo-form">
                        <label for="mensaje">MENSAJE</label>
                        <textarea id="mensaje" name="mensaje" rows="7" placeholder="Escribí tu mensaje..."></textarea>
                    </div>

                    <button type="submit" class="btn-enviar">
                        <span>ENVIAR ↗</span>
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-bg">
            <img src="img/fondo-hero.png" alt="Fondo texturizado">
        </div>
        <div class="footer-contenido">
            <div class="footer-colus">
                <div class="columna-menu">
                    <p class="p-titulo-col">MENÚ</p>
                    <ul>
                        <li><a href="index.html">INICIO</a></li>
                        <li><a href="sobre-mi.html">SOBRE MÍ</a></li>
                        <li><a href="contacto.html">CONTACTO</a></li>
                        <li><a href="proyectos.html">PROYECTOS</a></li>
                    </ul>
                </div>
                <div class="columna-redes">
                    <p class="p-titulo-col">REDES</p>
                    <ul>
                        <li><a href="https://instagram.com" target="_blank">INSTAGRAM</a></li>
                        <li><a href="https://behance.net" target="_blank">BEHANCE</a></li>
                        <li><a href="https://linkedin.com" target="_blank">LINKEDIN</a></li>
                    </ul>
                </div>
            </div>
            <div class="h2-gracias">
                <h2>GRACIAS <span class="salto-linea">POR VER</span></h2>
            </div>
        </div>
        <div class="div-copyright">
            <img src="img/favicon.vsg.svg" alt="Logotipo flor">
            <p>Todos los derechos reservados ® 2026</p>
        </div>
    </footer>
</body>

</html>
